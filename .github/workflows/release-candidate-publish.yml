name: Release candidate artifacts

on:
  workflow_call:
    inputs:
      runner:
        description: Approved Linux runner with Docker and the shared BuildKit configuration for image publishing
        type: string
        required: true
      buildkit-config:
        description: BuildKit configuration path, or empty for Docker defaults
        type: string
        default: /etc/buildkit/buildkitd.toml
      default-branch:
        description: Stable history branch, defaults to the repository default branch
        type: string
        default: ""
      images:
        description: JSON array of image name, context, dockerfile, and optional target and buildArgs objects
        type: string
        default: "[]"
      charts:
        description: JSON array of chart name, path, and optional localDependencies, versionValuePaths, and lintValues objects
        type: string
        default: "[]"
      submodules:
        description: Recursively check out product submodules using checkout read access
        type: boolean
        default: false
      validate-artifacts:
        description: Build images and lint/package charts without publishing on nonrelease events
        type: boolean
        default: false
      environment:
        description: Protected GitHub environment for artifact credentials and deployment rules
        type: string
        required: true
      ngc-path:
        description: NGC organization/team path for images and charts
        type: string
        required: true
    secrets:
      release-deploy-key:
        description: Optional SSH deploy key for source RC tags and channel notes
        required: false
      NGC_DSX_COMPONENTS_PUSH_KEY:
        description: NGC push key, may instead be supplied by the selected environment
        required: false
    outputs:
      version:
        description: Source RC version without the v prefix
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: Immutable source RC tag
        value: ${{ jobs.release.outputs.tag }}
      release-url:
        description: GitHub prerelease URL
        value: ${{ jobs.release.outputs.release-url }}

permissions:
  contents: read

concurrency:
  group: dsx-rc-artifacts-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/release/')
    uses: ./.github/workflows/release-candidate-checks.yml

  plan:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    outputs:
      images: ${{ steps.plan.outputs.images }}
      charts: ${{ steps.plan.outputs.charts }}
      image-count: ${{ steps.plan.outputs.image-count }}
      chart-count: ${{ steps.plan.outputs.chart-count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: release-source
          submodules: ${{ inputs.submodules && 'recursive' || false }}
          persist-credentials: false
      - name: Require the reusable workflow revision
        if: job.workflow_sha == ''
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: dsx-release-tools
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: dcarbone/install-yq-action@64b1b9eb28920bb1a4c13c05321df284f9a8f940 # v1.1.1
      - name: Validate artifact declarations before creating a source tag
        id: plan
        working-directory: release-source
        env:
          RC_IMAGES: ${{ inputs.images }}
          RC_CHARTS: ${{ inputs.charts }}
          RC_NGC_PATH: ${{ inputs.ngc-path }}
        run: node ../dsx-release-tools/.github/actions/release-artifacts/plan.cjs
      - name: Check image build prerequisites before creating a source tag
        if: steps.plan.outputs.image-count != '0'
        env:
          BUILDKIT_CONFIG: ${{ inputs.buildkit-config }}
        run: |
          docker info >/dev/null
          if [[ -n "$BUILDKIT_CONFIG" && ! -r "$BUILDKIT_CONFIG" ]]; then
            echo "::error::The image runner must provide the selected BuildKit configuration."
            exit 1
          fi

  validate-images:
    name: Validate image (${{ matrix.name }})
    needs: [checks, plan]
    if: inputs.validate-artifacts && needs.plan.outputs.image-count != '0' && (github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: release-source
          submodules: ${{ inputs.submodules && 'recursive' || false }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: dsx-release-tools
          persist-credentials: false
      - name: Check source revision and image metadata
        id: metadata
        working-directory: release-source
        run: |
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build both image platforms without publishing
        uses: ./dsx-release-tools/.github/actions/docker-build
        with:
          image: nvcr.io/${{ inputs.ngc-path }}/${{ matrix.name }}
          tags: 0.0.0-rc.1
          context: release-source/${{ matrix.context }}
          dockerfile: release-source/${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          build-args: ${{ matrix.buildArgs || '' }}
          platforms: linux/amd64,linux/arm64
          push: "false"
          buildkit-config: ${{ inputs.buildkit-config }}
          cache: "false"
          labels: |
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=0.0.0-rc.1

  validate-charts:
    name: Validate chart (${{ matrix.name }})
    needs: [checks, plan]
    if: inputs.validate-artifacts && needs.plan.outputs.chart-count != '0' && (github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.charts) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: release-source
          submodules: ${{ inputs.submodules && 'recursive' || false }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: dsx-release-tools
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: dcarbone/install-yq-action@64b1b9eb28920bb1a4c13c05321df284f9a8f940 # v1.1.1
      - name: Install Helm
        run: bash dsx-release-tools/.github/actions/helm-shared/scripts/install-helm.sh
      - name: Prepare chart metadata and local dependencies
        working-directory: release-source
        env:
          RC_CHART: ${{ toJSON(matrix) }}
          RELEASE_VERSION: 0.0.0-rc.1
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          node ../dsx-release-tools/.github/actions/release-artifacts/prepare-chart.cjs
      - name: Lint and package the chart without publishing
        uses: ./dsx-release-tools/.github/actions/helm-package-push
        with:
          chart-path: release-source/${{ matrix.path }}
          chart-version: 0.0.0-rc.1
          app-version: 0.0.0-rc.1
          lint: "true"
          lint-values: ${{ toJSON(matrix.lintValues || fromJSON('{}')) }}
          ngc-push: "false"

  release:
    needs: plan
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    uses: ./.github/workflows/release-candidate.yml
    permissions:
      contents: write
    with:
      runner: ${{ inputs.runner }}
      default-branch: ${{ inputs.default-branch }}
    secrets:
      release-deploy-key: ${{ secrets.release-deploy-key }}

  images:
    name: RC image (${{ matrix.name }})
    needs: [plan, release]
    if: needs.release.outputs.should-publish == 'true' && needs.plan.outputs.image-count != '0'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - name: Require the environment's NGC credential
        env:
          NGC_KEY: ${{ secrets.NGC_DSX_COMPONENTS_PUSH_KEY }}
        run: |
          if [[ -z "$NGC_KEY" ]]; then
            echo "::error::Configure NGC_DSX_COMPONENTS_PUSH_KEY in the publishing environment."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          path: release-source
          submodules: ${{ inputs.submodules && 'recursive' || false }}
          persist-credentials: false
      - name: Require the reusable workflow revision
        if: job.workflow_sha == ''
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: dsx-release-tools
          persist-credentials: false
      - name: Check source revision and image metadata
        id: metadata
        working-directory: release-source
        run: |
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: nvcr.io
          username: $oauthtoken
          password: ${{ secrets.NGC_DSX_COMPONENTS_PUSH_KEY }}
      - name: Check for an existing immutable image
        id: existing
        env:
          IMAGE_REF: nvcr.io/${{ inputs.ngc-path }}/${{ matrix.name }}:${{ needs.release.outputs.version }}
        run: |
          set +e
          bash dsx-release-tools/.github/actions/release-artifacts/verify-image.sh "$IMAGE_REF" "$GITHUB_SHA"
          status=$?
          set -e
          case "$status" in
            0) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Build and publish the missing image
        if: steps.existing.outputs.exists != 'true'
        uses: ./dsx-release-tools/.github/actions/docker-build
        with:
          image: nvcr.io/${{ inputs.ngc-path }}/${{ matrix.name }}
          tags: ${{ needs.release.outputs.version }}
          context: release-source/${{ matrix.context }}
          dockerfile: release-source/${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          build-args: ${{ matrix.buildArgs || '' }}
          platforms: linux/amd64,linux/arm64
          push: "true"
          buildkit-config: ${{ inputs.buildkit-config }}
          registry: nvcr.io
          username: $oauthtoken
          password: ${{ secrets.NGC_DSX_COMPONENTS_PUSH_KEY }}
          cache-scope: rc-${{ matrix.name }}
          labels: |
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
      - name: Verify the published image
        env:
          IMAGE_REF: nvcr.io/${{ inputs.ngc-path }}/${{ matrix.name }}:${{ needs.release.outputs.version }}
        run: bash dsx-release-tools/.github/actions/release-artifacts/verify-image.sh "$IMAGE_REF" "$GITHUB_SHA"

  charts:
    name: RC chart (${{ matrix.name }})
    needs: [plan, release]
    if: needs.release.outputs.should-publish == 'true' && needs.plan.outputs.chart-count != '0'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.charts) }}
    steps:
      - name: Require the environment's NGC credential
        env:
          NGC_KEY: ${{ secrets.NGC_DSX_COMPONENTS_PUSH_KEY }}
        run: |
          if [[ -z "$NGC_KEY" ]]; then
            echo "::error::Configure NGC_DSX_COMPONENTS_PUSH_KEY in the publishing environment."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          path: release-source
          submodules: ${{ inputs.submodules && 'recursive' || false }}
          persist-credentials: false
      - name: Require the reusable workflow revision
        if: job.workflow_sha == ''
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: dsx-release-tools
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: dcarbone/install-yq-action@64b1b9eb28920bb1a4c13c05321df284f9a8f940 # v1.1.1
      - name: Install Helm
        run: bash dsx-release-tools/.github/actions/helm-shared/scripts/install-helm.sh
      - name: Authenticate the chart registry
        env:
          CC_HELM_NGC_KEY: ${{ secrets.NGC_DSX_COMPONENTS_PUSH_KEY }}
          CC_HELM_NGC_PATH: ${{ inputs.ngc-path }}
          CC_HELM_NGC_REGISTRY: https://helm.ngc.nvidia.com
        run: bash dsx-release-tools/.github/actions/helm-shared/scripts/utils.sh helm_ngc_repo_add
      - name: Check for an existing immutable chart
        id: existing
        env:
          CHART_NAME: ${{ matrix.name }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set +e
          bash dsx-release-tools/.github/actions/release-artifacts/verify-chart.sh --check-existing
          status=$?
          set -e
          case "$status" in
            0) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Prepare chart metadata and local dependencies
        if: steps.existing.outputs.exists != 'true'
        working-directory: release-source
        env:
          RC_CHART: ${{ toJSON(matrix) }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          node ../dsx-release-tools/.github/actions/release-artifacts/prepare-chart.cjs
      - name: Publish the chart without overwriting existing versions
        if: steps.existing.outputs.exists != 'true'
        uses: ./dsx-release-tools/.github/actions/helm-package-push
        with:
          chart-path: release-source/${{ matrix.path }}
          chart-version: ${{ needs.release.outputs.version }}
          app-version: ${{ needs.release.outputs.version }}
          lint: "true"
          lint-values: ${{ toJSON(matrix.lintValues || fromJSON('{}')) }}
          ngc-key: ${{ secrets.NGC_DSX_COMPONENTS_PUSH_KEY }}
          ngc-path: ${{ inputs.ngc-path }}
          ngc-duplicate: skip
      - name: Verify the published chart
        env:
          CHART_NAME: ${{ matrix.name }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: bash dsx-release-tools/.github/actions/release-artifacts/verify-chart.sh

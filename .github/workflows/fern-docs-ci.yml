name: Fern Docs CI

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label"
        required: false
        default: "linux-amd64-cpu4"
        type: string
      fern_docs_path:
        description: Caller-relative site YAML; empty uses the existing fern directory
        type: string
        default: ''
      fern_organization:
        description: Organization for the generated Fern config when fern_docs_path is set
        type: string
        default: nvidia
      fern_cli_version:
        description: "Exact Fern CLI version; must match fern/fern.config.json when fern_docs_path is empty"
        required: false
        default: '5.186.0'
        type: string
      docs_directory:
        description: "Caller-relative directory containing Markdown and MDX pages"
        required: false
        default: "docs"
        type: string
      docs_paths:
        description: "Markdown paths to check, one per line; defaults to docs_directory"
        required: false
        default: ""
        type: string
      navigation_file:
        description: "Set to index.yml for repository-wide navigation"
        required: false
        default: ""
        type: string
      frozen_versions:
        description: "Rebuild registered versions from release tags"
        required: false
        default: false
        type: boolean
      native_checks:
        description: "Run Fern native MDX and broken-link checks instead of Lychee"
        required: false
        default: false
        type: boolean
      fern_working_directory:
        description: "Caller-relative directory where fern check runs"
        required: false
        default: "."
        type: string
      link_args:
        description: "Arguments passed to lychee"
        required: false
        default: "--offline --no-progress 'docs/**/*.md' 'docs/**/*.mdx'"
        type: string

permissions:
  contents: read

jobs:
  fern-check:
    name: Fern Check
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: source

      - name: Require reusable workflow SHA
        if: ${{ job.workflow_sha == '' }}
        shell: bash
        run: |
          echo "::error::Reusable workflow SHA is unavailable"
          exit 1

      - name: Checkout shared Fern checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dsx-ai-factory/dsx-github-actions
          ref: ${{ job.workflow_sha }}
          path: _fern-shared
          persist-credentials: false

      - name: Prepare and validate Fern docs
        uses: ./_fern-shared/.github/actions/fern-docs
        with:
          working-directory: source
          fern-working-directory: ${{ inputs.fern_working_directory }}
          fern-cli-version: ${{ inputs.fern_cli_version }}
          fern-docs-path: ${{ inputs.fern_docs_path }}
          fern-organization: ${{ inputs.fern_organization }}
          docs-directory: ${{ inputs.docs_directory }}
          docs-paths: ${{ inputs.docs_paths || inputs.docs_directory }}
          navigation-file: ${{ inputs.navigation_file }}
          frozen-versions: ${{ inputs.frozen_versions }}
          native-checks: ${{ inputs.native_checks }}

      - name: Check links
        if: ${{ !inputs.native_checks }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          workingDirectory: source
          args: ${{ inputs.link_args }}
          fail: true

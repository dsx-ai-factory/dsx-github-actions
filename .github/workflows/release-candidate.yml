name: Release candidate

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted or approved Linux runner
        type: string
        default: ubuntu-latest
      default-branch:
        description: Compatibility input; release history is selected from repository tags
        type: string
        default: ""
    secrets:
      release-deploy-key:
        description: Optional repository-scoped SSH deploy key authorized to push RC tags and channel notes
        required: false
    outputs:
      should-publish:
        description: Whether this commit has a verified RC for downstream artifacts
        value: ${{ jobs.release.outputs.should-publish }}
      version:
        description: RC version without the v prefix
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: Immutable source RC tag
        value: ${{ jobs.release.outputs.tag }}
      reused-existing-tag:
        description: Whether this run reused an existing RC tag
        value: ${{ jobs.release.outputs.reused-existing-tag }}
      release-url:
        description: Verified GitHub prerelease URL
        value: ${{ jobs.release.outputs.release-url }}

permissions:
  contents: write

concurrency:
  group: dsx-release-candidate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/release-candidate-checks.yml
    permissions:
      contents: read

  release:
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RC_GIT_SSH: ${{ secrets.release-deploy-key != '' }}
    outputs:
      should-publish: ${{ steps.verify.outcome == 'success' && steps.rc.outputs.should-publish || 'false' }}
      version: ${{ steps.rc.outputs.version }}
      tag: ${{ steps.rc.outputs.tag }}
      reused-existing-tag: ${{ steps.rc.outputs.reused-existing-tag }}
      release-url: ${{ steps.verify.outputs.release-url }}
    defaults:
      run:
        working-directory: release-source
    steps:
      - name: Checkout source history without product release configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: release-source
          ssh-key: ${{ secrets.release-deploy-key }}
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github/
      - name: Require the reusable workflow revision
        if: job.workflow_sha == ''
        run: |
          echo "::error::Reusable workflow SHA is unavailable"
          exit 1
      - name: Checkout shared release implementation at the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: dsx-rc-actions
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Require a protected release branch and its current head
        env:
          RC_REF_PROTECTED: ${{ github.ref_protected }}
        run: bash ../dsx-rc-actions/.github/actions/release-candidate/check-source.sh
      - name: Install the shared RC planner
        run: npm ci --ignore-scripts --legacy-peer-deps --prefix ../dsx-rc-actions/.github/actions/release-candidate
      - name: Set isolated preview paths
        run: |
          printf 'RC_PLAN_PATH=%s/dsx-rc-plan.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'RC_NOTES_PATH=%s/dsx-rc-notes.md\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Require working Deploy Key push authentication
        if: env.RC_GIT_SSH == 'true'
        timeout-minutes: 1
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: bash ../dsx-rc-actions/.github/actions/release-candidate/check-git-auth.sh
      - name: Preview the target release line
        id: rc
        run: node ../dsx-rc-actions/.github/actions/release-candidate/publish.mjs --dry-run
      - name: Verify existing RC source and channel metadata
        if: steps.rc.outputs.reused-existing-tag == 'true'
        env:
          RC_TAG: ${{ steps.rc.outputs.tag }}
          RC_VERSION: ${{ steps.rc.outputs.version }}
        run: bash ../dsx-rc-actions/.github/actions/release-candidate/verify-existing-tag.sh
      - name: Validate the candidate before publishing
        if: steps.rc.outputs.should-publish == 'true'
        env:
          RC_VERSION: ${{ steps.rc.outputs.version }}
        run: node ../dsx-rc-actions/.github/actions/release-candidate/validate-version.cjs
      - name: Publish the release candidate
        if: steps.rc.outputs.should-publish == 'true' && steps.rc.outputs.reused-existing-tag != 'true'
        run: node ../dsx-rc-actions/.github/actions/release-candidate/publish.mjs --publish
      - name: Verify or recover the GitHub prerelease
        id: verify
        if: steps.rc.outputs.should-publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RC_TAG: ${{ steps.rc.outputs.tag }}
          RC_VERSION: ${{ steps.rc.outputs.version }}
        run: bash ../dsx-rc-actions/.github/actions/release-candidate/verify-prerelease.sh
      - name: Report no release-worthy changes
        if: steps.rc.outputs.should-publish != 'true'
        run: echo "No RC on this commit. No tag or release was created." >> "$GITHUB_STEP_SUMMARY"

name: Promote RC

on:
  workflow_call:
    inputs:
      rc_version:
        description: Exact verified RC version without the v prefix
        required: true
        type: string
    secrets:
      RC_PROMOTION_APP_PRIVATE_KEY:
        description: GitHub App private key from stable-release (app mode)
        required: false
      RC_PROMOTION_PAT:
        description: Temporary release token from stable-release (pat mode)
        required: false
      RC_PROMOTION_SOURCE_NGC_KEY:
        description: Source registry read key from stable-release
        required: true
      RC_PROMOTION_DESTINATION_NGC_KEY:
        description: Destination registry read and publish key from stable-release
        required: true

permissions:
  contents: read

concurrency:
  group: dsx-stable-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release-mode: ${{ steps.admission.outputs.release-mode }}
    steps:
      - name: Require a manual dispatch from the protected default branch
        id: admission
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROTECTED: ${{ github.ref_protected }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          RC_VERSION: ${{ inputs.rc_version }}
          RELEASE_MODE: ${{ vars.DSX_RELEASE_MODE }}
        run: |
          set -euo pipefail
          [[ "$EVENT" == workflow_dispatch ]]
          [[ "$REF" == "refs/heads/$DEFAULT_BRANCH" && "$PROTECTED" == true ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RC_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$ ]]
          [[ "$RELEASE_MODE" == rc-promotion ]]
          echo "release-mode=rc-promotion" >> "$GITHUB_OUTPUT"

  promote:
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: stable-release
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - name: Select release authentication
        id: release-auth
        env:
          AUTH_MODE: ${{ vars.RC_PROMOTION_AUTH_MODE || 'app' }}
        run: |
          set -euo pipefail
          case "$AUTH_MODE" in
            app|pat) echo "mode=$AUTH_MODE" >> "$GITHUB_OUTPUT" ;;
            *) echo "RC_PROMOTION_AUTH_MODE must be app or pat" >&2; exit 1 ;;
          esac
      - name: Check selected promotion credentials
        env:
          AUTH_MODE: ${{ steps.release-auth.outputs.mode }}
          RC_PROMOTION_APP_ID: ${{ vars.RC_PROMOTION_APP_ID }}
          RC_PROMOTION_APP_PRIVATE_KEY: ${{ steps.release-auth.outputs.mode == 'app' && secrets.RC_PROMOTION_APP_PRIVATE_KEY || '' }}
          RC_PROMOTION_PAT: ${{ steps.release-auth.outputs.mode == 'pat' && secrets.RC_PROMOTION_PAT || '' }}
          RC_PROMOTION_SOURCE_NGC_KEY: ${{ secrets.RC_PROMOTION_SOURCE_NGC_KEY }}
          RC_PROMOTION_DESTINATION_NGC_KEY: ${{ secrets.RC_PROMOTION_DESTINATION_NGC_KEY }}
        run: |
          set +x
          set -euo pipefail
          required=(RC_PROMOTION_SOURCE_NGC_KEY RC_PROMOTION_DESTINATION_NGC_KEY)
          case "$AUTH_MODE" in
            app) required+=(RC_PROMOTION_APP_ID RC_PROMOTION_APP_PRIVATE_KEY) ;;
            pat) required+=(RC_PROMOTION_PAT) ;;
            *) echo "RC_PROMOTION_AUTH_MODE must be app or pat" >&2; exit 1 ;;
          esac
          missing=false
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing $name. Check stable-release settings and the caller's explicit secret mappings." >&2
              missing=true
            fi
          done
          [[ "$missing" == false ]]
      - name: Select temporary registry credential paths
        run: |
          {
            echo "PROMOTION_AUTH_ROOT=$RUNNER_TEMP/rc-promotion-auth"
            echo "HELM_CONFIG_HOME=$RUNNER_TEMP/rc-promotion-helm/config"
            echo "HELM_CACHE_HOME=$RUNNER_TEMP/rc-promotion-helm/cache"
            echo "HELM_DATA_HOME=$RUNNER_TEMP/rc-promotion-helm/data"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: promotion-source
          persist-credentials: false
          sparse-checkout: .github/rc-promotion.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: dsx-promotion-tools
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Install the shared Conventional Commits notes generator
        run: npm ci --ignore-scripts --legacy-peer-deps --prefix dsx-promotion-tools/.github/actions/promote-rc
      - uses: dcarbone/install-yq-action@4075b4dca348d74bd83f2bf82d30f25d7c54539b # v1.3.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install registry tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          bash dsx-promotion-tools/.github/actions/helm-shared/scripts/install-helm.sh
          bash dsx-promotion-tools/.github/actions/helm-shared/scripts/install-ngc.sh
      - name: Create the repository-scoped release token
        id: release-token
        if: steps.release-auth.outputs.mode == 'app'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RC_PROMOTION_APP_ID }}
          private-key: ${{ secrets.RC_PROMOTION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write
          skip-token-revoke: false
      - name: Verify and promote the selected RC
        env:
          GH_TOKEN: ${{ github.token }}
          RC_PROMOTION_GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          RC_PROMOTION_AUTH_MODE: ${{ steps.release-auth.outputs.mode }}
          RC_PROMOTION_PAT: ${{ steps.release-auth.outputs.mode == 'pat' && secrets.RC_PROMOTION_PAT || '' }}
          RC_VERSION: ${{ inputs.rc_version }}
          DSX_RELEASE_MODE: ${{ needs.admission.outputs.release-mode }}
          RC_PROMOTION_SOURCE_NGC_KEY: ${{ secrets.RC_PROMOTION_SOURCE_NGC_KEY }}
          RC_PROMOTION_DESTINATION_NGC_KEY: ${{ secrets.RC_PROMOTION_DESTINATION_NGC_KEY }}
        run: |
          set +x
          if [[ "$RC_PROMOTION_AUTH_MODE" == pat ]]; then
            export RC_PROMOTION_GITHUB_TOKEN="$RC_PROMOTION_PAT"
          fi
          unset RC_PROMOTION_PAT
          python3 dsx-promotion-tools/.github/actions/promote-rc/promotion.py promote \
            --policy promotion-source/.github/rc-promotion.json
      - name: Preserve the promotion result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promotion-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: promotion-result.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Remove local registry credentials
        if: always()
        run: rm -rf -- "$PROMOTION_AUTH_ROOT" "$HELM_CONFIG_HOME" "$HELM_CACHE_HOME" "$HELM_DATA_HOME"

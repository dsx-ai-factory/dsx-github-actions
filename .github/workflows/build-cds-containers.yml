name: Build CDS Containers

# Trigger only on pushes to main or copy-pr-bot mirror branches, and only when relevant paths change
on:
  push:
    branches:
      - main
      - pull-request/**
    paths:
      - 'cds-containers/**'
      - '.github/workflows/build-cds-containers.yml'
      - '.github/scripts/check_cds_tags.py'
  workflow_dispatch:

concurrency:
  group: build-cds-containers-${{ github.ref }}
  # Keep pending releases; the default single pending slot replaces older runs.
  queue: max
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: dsx-ai-factory
  IMAGE_PREFIX: dsx-cds-  # Prefix to identify CDS container images

defaults:
  run:
    shell: bash

jobs:
  get-version:
    runs-on: linux-amd64-cpu4
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
      publish: ${{ steps.extract-version.outputs.publish }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Validate and extract version
        id: extract-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < cds-containers/VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "cds-containers/VERSION must contain a semantic version" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            base_sha="$PUSH_BASE_SHA"
            if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ || "$base_sha" =~ ^0+$ ]]; then
              echo "Cannot determine the previous main commit" >&2
              exit 1
            fi
          else
            # A newly created copy-pr-bot branch has an all-zero event.before.
            base_sha="$(git merge-base "$GITHUB_SHA" origin/main)"
          fi
          git rev-parse --verify "${base_sha}^{commit}" >/dev/null
          base_version="$(git show "$base_sha:cds-containers/VERSION" | tr -d '[:space:]')"
          image_changes="$(git diff --name-only "$base_sha" "$GITHUB_SHA" -- \
            cds-containers/tools/ cds-containers/go-dev-1.24-alpine/ cds-containers/go-dev-1.24-debian/)"
          version_changed=false
          if [[ "$version" != "$base_version" ]]; then
            version_changed=true
          fi
          if [[ -n "$image_changes" && "$version_changed" != "true" ]]; then
            echo "Container image changes require a VERSION bump" >&2
            exit 1
          fi

          publish=false
          if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$version_changed" == "true" ]]; then
            publish=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Container version: $version (publish: $publish)"

  build-and-test-images:
    runs-on: linux-amd64-cpu4
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write  # Required to push to GHCR
    needs: get-version
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: tools
            path: cds-containers/tools
            description: "CDS tools container with Bazel, Terraform, Helm, kubectl, NGC CLI, etc."
          - name: go-dev-1.24-alpine
            path: cds-containers/go-dev-1.24-alpine
            description: "Go 1.24 development container (Alpine-based, minimal size)"
          - name: go-dev-1.24-debian
            path: cds-containers/go-dev-1.24-debian
            description: "Go 1.24 development container (Debian-based, better compatibility)"

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          buildkitd-config: /etc/buildkit/buildkitd.toml

      - name: Log in to GitHub Container Registry
        if: needs.get-version.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_PREFIX }}${{ matrix.image.name }}
          tags: |
            type=raw,value=build-${{ github.run_id }}-${{ github.run_attempt }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.description=${{ matrix.image.description }}
            org.opencontainers.image.vendor=NVIDIA
            org.opencontainers.image.version=${{ needs.get-version.outputs.version }}

      - name: Build image for testing
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./cds-containers
          file: ${{ matrix.image.path }}/Dockerfile
          push: ${{ needs.get-version.outputs.publish == 'true' }}
          load: ${{ needs.get-version.outputs.publish != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select the exact built image
        id: test-image
        env:
          PUBLISH: ${{ needs.get-version.outputs.publish }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_PREFIX }}${{ matrix.image.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          if [[ "$PUBLISH" == "true" ]]; then
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "image=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
          else
            [[ "$IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "image=$IMAGE_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Test Go development image
        if: startsWith(matrix.image.name, 'go-dev-')
        env:
          IMAGE: ${{ steps.test-image.outputs.image }}
        run: |
          docker run --rm -i "$IMAGE" sh -ec '
            go version
            golangci-lint --version
            workdir="$(mktemp -d)"
            cd "$workdir"
            cat > hello.go
            goimports -w hello.go
            go build hello.go
            ./hello
          ' <<'EOF'
          package main
          func main() {
              fmt.Println("Hello from the CDS Go container")
          }
          EOF

      - name: Test tools image
        if: matrix.image.name == 'tools'
        env:
          IMAGE: ${{ steps.test-image.outputs.image }}
        run: |
          docker run --rm "$IMAGE" sh -ec '
            bazel --version
            bazel6 --version
            bazel8 --version
            kubectl version --client
            helm version --short
            terraform version
            terragrunt --version
            ngc version
            yq --version
            node --version
            python3 --version
            uv --version
          '

      - name: Record tested digest
        if: needs.get-version.outputs.publish == 'true'
        env:
          IMAGE_NAME: ${{ matrix.image.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/$IMAGE_NAME"

      - name: Upload tested digest
        if: needs.get-version.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cds-digest-${{ matrix.image.name }}
          path: digests/${{ matrix.image.name }}
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish-images:
    runs-on: linux-amd64-cpu4
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    needs: [get-version, build-and-test-images]
    if: needs.get-version.outputs.publish == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download tested digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cds-digest-*
          path: digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          buildkitd-config: /etc/buildkit/buildkitd.toml

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check all release tags against tested digests
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for name in tools go-dev-1.24-alpine go-dev-1.24-debian; do
            digest="$(cat "digests/$name")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            python3 .github/scripts/check_cds_tags.py \
              "$REGISTRY/$IMAGE_NAMESPACE/$IMAGE_PREFIX$name" "$digest" "$VERSION" "sha-$GITHUB_SHA" \
              > "digests/missing-$name"
          done

      - name: Promote tested digests to release tags
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          # An older queued release must not move latest behind current main.
          git fetch --no-tags origin main
          current_version="$(git show FETCH_HEAD:cds-containers/VERSION | tr -d '[:space:]')"
          for name in tools go-dev-1.24-alpine go-dev-1.24-debian; do
            image="$REGISTRY/$IMAGE_NAMESPACE/$IMAGE_PREFIX$name"
            digest="$(cat "digests/$name")"
            tags=()
            while IFS= read -r tag; do
              tags+=(--tag "$image:$tag")
            done < "digests/missing-$name"
            if [[ "$VERSION" == "$current_version" ]]; then
              tags+=(--tag "$image:latest")
            fi
            if (( ${#tags[@]} > 0 )); then
              docker buildx imagetools create --prefer-index=false "${tags[@]}" "$image@$digest"
            fi
            echo "Published $image:$VERSION ($digest)"
          done

  summary:
    runs-on: linux-amd64-cpu4
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [get-version, build-and-test-images, publish-images]
    if: always()

    steps:
      - name: Build summary
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
          VERSION_RESULT: ${{ needs.get-version.result }}
          BUILD_RESULT: ${{ needs.build-and-test-images.result }}
          PUBLISH_RESULT: ${{ needs.publish-images.result }}
          PUBLISH: ${{ needs.get-version.outputs.publish }}
        run: |
          {
            echo "## CDS Containers Build Summary"
            echo "Version: $VERSION"
            echo "Commit: $GITHUB_SHA"
            echo "Version validation: $VERSION_RESULT"
            echo "Build and smoke tests: $BUILD_RESULT"
            echo "Publication: $PUBLISH_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$VERSION_RESULT" != "success" || "$BUILD_RESULT" != "success" ||
                ( "$PUBLISH" == "true" && "$PUBLISH_RESULT" != "success" ) ]]; then
            echo "Build, test, or publication did not complete successfully." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$PUBLISH_RESULT" == "success" ]]; then
            {
              echo "All 3 images passed smoke tests and were published. Usage:"
              echo '```yaml'
              echo "container:"
              echo "  image: $REGISTRY/$IMAGE_NAMESPACE/${IMAGE_PREFIX}tools:sha-$GITHUB_SHA"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All 3 images passed smoke tests. This run did not publish release tags." >> "$GITHUB_STEP_SUMMARY"
          fi

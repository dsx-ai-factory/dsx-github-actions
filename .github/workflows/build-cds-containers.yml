name: Build CDS Containers

# pull_request jobs run on GitHub-hosted runners. NVIDIA self-hosted runners
# reject pull_request events until copy-pr-bot has vetted the PR.
on:
  pull_request:
    paths:
      - 'cds-containers/**'
      - '.github/workflows/build-cds-containers.yml'
  push:
    branches:
      - main
      - pull-request/**
    paths:
      - 'cds-containers/**'
      - '.github/workflows/build-cds-containers.yml'
  workflow_dispatch:

concurrency:
  group: build-cds-containers-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: nvidia
  IMAGE_PREFIX: dsx-cds-  # Prefix to identify CDS container images

jobs:
  get-version:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'linux-amd64-cpu4' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
      publish: ${{ steps.extract-version.outputs.publish }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and extract version
        id: extract-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < cds-containers/VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "cds-containers/VERSION must contain a semantic version" >&2
            exit 1
          fi

          base_sha="$PUSH_BASE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          fi

          version_changed=false
          if [[ -n "$base_sha" && ! "$base_sha" =~ ^0+$ ]]; then
            if ! git diff --quiet "$base_sha" "$GITHUB_SHA" -- cds-containers/VERSION; then
              version_changed=true
            fi
            if ! git diff --quiet "$base_sha" "$GITHUB_SHA" -- ':(glob)cds-containers/*/Dockerfile' &&
               [[ "$version_changed" != "true" ]]; then
              echo "Container image changes require a VERSION bump" >&2
              exit 1
            fi
          fi

          publish=false
          if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" &&
                "$version_changed" == "true" ]]; then
            publish=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Container version: $version (publish: $publish)"

  check-version-tags:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'linux-amd64-cpu4' }}
    timeout-minutes: 5
    permissions:
      packages: read
    needs: get-version
    if: needs.get-version.outputs.publish == 'true'
    steps:
      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Ensure version tags are unused
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          for name in tools grafana-backup-tool go-dev-1.24-alpine go-dev-1.24-debian; do
            image="ghcr.io/nvidia/dsx-cds-${name}:${VERSION}"
            if docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "$image already exists; bump cds-containers/VERSION" >&2
              exit 1
            fi
          done

  build-and-push-images:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'linux-amd64-cpu4' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write  # Required to push to GHCR
    needs: [get-version, check-version-tags]
    if: always() && needs.get-version.result == 'success' && (needs.check-version-tags.result == 'success' || needs.check-version-tags.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: tools
            path: cds-containers/tools
            description: "CDS tools container with Bazel, Terraform, Helm, kubectl, NGC CLI, etc."
          - name: grafana-backup-tool
            path: cds-containers/grafana-backup-tool
            description: "Grafana backup tool container"
          - name: go-dev-1.24-alpine
            path: cds-containers/go-dev-1.24-alpine
            description: "Go 1.24 development container (Alpine-based, minimal size)"
          - name: go-dev-1.24-debian
            path: cds-containers/go-dev-1.24-debian
            description: "Go 1.24 development container (Debian-based, better compatibility)"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config: /etc/buildkit/buildkitd.toml

      - name: Log in to GitHub Container Registry
        if: needs.get-version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_PREFIX }}${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ needs.get-version.outputs.version }},enable=${{ needs.get-version.outputs.publish }}
            type=raw,value=latest,enable=${{ needs.get-version.outputs.publish }}
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=ref,event=pr
          labels: |
            org.opencontainers.image.description=${{ matrix.image.description }}
            org.opencontainers.image.vendor=NVIDIA
            org.opencontainers.image.version=${{ needs.get-version.outputs.version }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./cds-containers
          file: ${{ matrix.image.path }}/Dockerfile
          push: ${{ needs.get-version.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Go development image
        if: needs.get-version.outputs.publish == 'true' && matrix.image.name == 'go-dev-1.24-alpine'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_PREFIX }}${{ matrix.image.name }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm "$IMAGE" sh -ec '
            go version
            golangci-lint --version
            goimports -h >/dev/null
          '
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          cat > "$workdir/hello.go" <<'EOF'
          package main
          import "fmt"
          func main() {
              fmt.Println("Hello from the CDS Go container")
          }
          EOF
          docker run --rm -v "$workdir:/work" -w /work "$IMAGE" sh -ec '
            go build hello.go
            ./hello
          '

      - name: Test tools image
        if: needs.get-version.outputs.publish == 'true' && matrix.image.name == 'tools'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_PREFIX }}${{ matrix.image.name }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm "$IMAGE" sh -ec '
            bazel --version
            bazel6 --version
            bazel8 --version
            kubectl version --client
            helm version --short
            terraform version
            terragrunt --version
            ngc version
            yq --version
            node --version
            python3 --version
            uv --version
          '

      - name: Build summary
        run: |
          if [ "${{ needs.get-version.outputs.publish }}" = "true" ]; then
            echo "Image built, tested by digest when applicable, and pushed to GHCR:"
          else
            echo "Image built successfully without publishing."
          fi
  summary:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'linux-amd64-cpu4' }}
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [get-version, build-and-push-images]
    if: always()

    steps:
      - name: Build summary
        run: |
          echo "## 🎉 CDS Containers Build Summary"
          echo ""
          echo "📦 Version: ${{ needs.get-version.outputs.version }}"
          echo "🔨 Trigger: ${{ github.event_name }}"
          echo "📌 Commit: ${{ github.sha }}"
          echo ""
          if [[ "${{ needs.get-version.outputs.publish }}" == "true" ]]; then
            echo "✅ Built and pushed 4 container images to GHCR:"
            echo "  - ghcr.io/nvidia/dsx-cds-tools:${{ needs.get-version.outputs.version }}"
            echo "  - ghcr.io/nvidia/dsx-cds-grafana-backup-tool:${{ needs.get-version.outputs.version }}"
            echo "  - ghcr.io/nvidia/dsx-cds-go-dev-1.24-alpine:${{ needs.get-version.outputs.version }}"
            echo "  - ghcr.io/nvidia/dsx-cds-go-dev-1.24-debian:${{ needs.get-version.outputs.version }}"
          else
            echo "✅ Built images successfully (not pushed on non-main branches)"
          fi
          echo ""
          echo "📍 Usage example:"
          echo "   container:"
          echo "     image: ghcr.io/nvidia/dsx-cds-tools:sha-${{ github.sha }}"
          echo "     credentials:"
          echo "       username: \${{ github.actor }}"
          echo "       password: \${{ secrets.GITHUB_TOKEN }}"
          echo ""
          echo "✅ All tests passed!"

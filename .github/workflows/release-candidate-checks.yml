name: RC contract checks

on:
  workflow_call:
  pull_request:
  push:
    branches: [main, "pull-request/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the shared workflow revision
        if: job.workflow_sha == ''
        run: |
          echo "::error::Reusable workflow SHA is unavailable"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install shared release test dependencies
        run: npm ci --ignore-scripts --prefix .github/actions/release-candidate/tests
      - name: Test release contracts against local Git repositories
        run: npm test --prefix .github/actions/release-candidate/tests
      - uses: dcarbone/install-yq-action@4075b4dca348d74bd83f2bf82d30f25d7c54539b # v1.3.1
      - name: Install Helm for local chart packaging tests
        run: bash .github/actions/helm-shared/scripts/install-helm.sh
      - name: Test artifact planning, preparation, and verification
        run: node --test .github/actions/release-artifacts/tests/*.test.cjs
      - name: Test the existing RC resolver
        run: .github/actions/resolve-release-candidate/test.sh
      - name: Prepare a separate local checkout for the resolver smoke test
        run: |
          git init --initial-branch=main .rc-resolver-smoke
          git -C .rc-resolver-smoke -c user.name='RC Test' -c user.email=rc-test@example.invalid \
            -c core.hooksPath=/dev/null -c commit.gpgsign=false commit --allow-empty -m 'test: local fixture'
          git -C .rc-resolver-smoke -c tag.gpgsign=false tag v1.2.3-rc.1
      - name: Exercise the resolver with an explicit checkout directory
        id: rc
        uses: ./.github/actions/resolve-release-candidate
        with:
          working-directory: .rc-resolver-smoke
      - name: Verify the resolver action outputs
        env:
          VERSION: ${{ steps.rc.outputs.version }}
          SHOULD_PUBLISH: ${{ steps.rc.outputs.should-publish }}
          REUSED: ${{ steps.rc.outputs.reused-existing-tag }}
        run: |
          [[ "$VERSION" == "1.2.3-rc.1" ]]
          [[ "$SHOULD_PUBLISH" == "true" ]]
          [[ "$REUSED" == "true" ]]

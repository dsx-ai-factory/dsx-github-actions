name: Validate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'pull-request/**'

permissions:
  contents: read

jobs:
  runtime-and-artifacts:
    name: Runtime and artifact compatibility
    if: github.event_name == 'workflow_dispatch'
    runs-on: linux-amd64-cpu4
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the runner-bundled JavaScript runtime
        id: runner-node
        continue-on-error: true
        uses: ./.github/tests/runner-node
      - name: Prepare artifact fixtures
        run: |
          mkdir -p fixtures
          printf '{"image":"example.invalid/test","digest":"sha256:fixture"}\n' > fixtures/digest.json
          printf '{"version":"1.2.3-rc.1","commit":"fixture"}\n' > fixtures/rc-promotion-manifest.json
      - name: Upload legacy evidence
        id: legacy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, compatibility fixture
        with:
          name: legacy-runtime-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: fixtures/digest.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload current evidence
        id: current
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: current-runtime-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: fixtures/rc-promotion-manifest.json
          archive: true
          if-no-files-found: error
          retention-days: 1
      - name: Download legacy evidence with the new action
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.legacy.outputs.artifact-id }}
          path: restored/legacy
          merge-multiple: true
      - name: Download current evidence with the new action
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.current.outputs.artifact-id }}
          path: restored/current
          merge-multiple: true
      - name: Verify unchanged artifact bytes and promotion ZIP contract
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.current.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.current.outputs.artifact-digest }}
        run: |
          cmp fixtures/digest.json restored/legacy/digest.json
          cmp fixtures/rc-promotion-manifest.json restored/current/rc-promotion-manifest.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > promotion.zip
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import zipfile
          data = Path("promotion.zip").read_bytes()
          assert hashlib.sha256(data).hexdigest() == os.environ["ARTIFACT_DIGEST"].removeprefix("sha256:")
          with zipfile.ZipFile("promotion.zip") as archive:
              assert archive.namelist() == ["rc-promotion-manifest.json"]
              assert archive.read("rc-promotion-manifest.json") == Path("fixtures/rc-promotion-manifest.json").read_bytes()
          PY
      - name: Require the runner security check after compatibility tests
        if: always()
        env:
          RUNTIME_RESULT: ${{ steps.runner-node.outcome }}
        run: test "$RUNTIME_RESULT" = success

  actions:
    name: Actions and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false

      - name: Run pre-commit checks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      - name: Test release candidate resolution
        run: .github/actions/resolve-release-candidate/test.sh

      - name: Test shared Python scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - uses: dcarbone/install-yq-action@64b1b9eb28920bb1a4c13c05321df284f9a8f940 # v1.1.1
      - name: Install Helm for chart comparison tests
        run: .github/actions/helm-shared/scripts/install-helm.sh
      - name: Test NGC Helm publication
        run: python3 -m unittest discover -s .github/actions/helm-shared/tests -p 'test_*.py'

      - name: Test image evidence and publication gates
        run: node --test .github/scripts/tests/image-attestation.test.cjs

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build public NGC base without inherited credentials
        run: .github/actions/docker-build/tests/anonymous-build.sh

      - name: Resolve release candidate with default settings
        id: default-rc
        uses: ./.github/actions/resolve-release-candidate
        with:
          new-release-published: "true"
          new-release-version: "1.2.3-rc.4"
          new-release-git-tag: "v1.2.3-rc.4"

      - name: Resolve release candidate with custom settings
        id: custom-rc
        uses: ./.github/actions/resolve-release-candidate
        with:
          new-release-published: "true"
          new-release-version: "2.0.0-preview.1"
          new-release-git-tag: "release/2.0.0-preview.1"
          prerelease-identifier: "preview"
          tag-prefix: "release/"

      - name: Verify release candidate action outputs
        env:
          DEFAULT_SHOULD_PUBLISH: ${{ steps.default-rc.outputs.should-publish }}
          DEFAULT_VERSION: ${{ steps.default-rc.outputs.version }}
          DEFAULT_TAG: ${{ steps.default-rc.outputs.tag }}
          DEFAULT_REUSED_EXISTING_TAG: ${{ steps.default-rc.outputs.reused-existing-tag }}
          CUSTOM_SHOULD_PUBLISH: ${{ steps.custom-rc.outputs.should-publish }}
          CUSTOM_VERSION: ${{ steps.custom-rc.outputs.version }}
          CUSTOM_TAG: ${{ steps.custom-rc.outputs.tag }}
          CUSTOM_REUSED_EXISTING_TAG: ${{ steps.custom-rc.outputs.reused-existing-tag }}
        run: |
          [[ "$DEFAULT_SHOULD_PUBLISH" == "true" ]]
          [[ "$DEFAULT_VERSION" == "1.2.3-rc.4" ]]
          [[ "$DEFAULT_TAG" == "v1.2.3-rc.4" ]]
          [[ "$DEFAULT_REUSED_EXISTING_TAG" == "false" ]]
          [[ "$CUSTOM_SHOULD_PUBLISH" == "true" ]]
          [[ "$CUSTOM_VERSION" == "2.0.0-preview.1" ]]
          [[ "$CUSTOM_TAG" == "release/2.0.0-preview.1" ]]
          [[ "$CUSTOM_REUSED_EXISTING_TAG" == "false" ]]

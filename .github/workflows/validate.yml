# Branch-only canary, not for merging into main.
name: SPDX Attestation Canary

on:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build-tools:
    name: Build and smoke-test the tools candidate
    if: >-
      github.repository == 'dsx-ai-factory/dsx-github-actions' &&
      github.ref == 'refs/heads/test/spdx-attestation-canary-20261024'
    runs-on: linux-amd64-cpu4
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.smoke.outputs.image }}
      digest: ${{ steps.smoke.outputs.digest }}
      sbom-artifact-id: ${{ steps.smoke.outputs.sbom-artifact-id }}
    steps:
      - name: Checkout the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build the native tools candidate with complete platform SBOMs
        id: build
        uses: ./.github/actions/docker-build
        with:
          image: ghcr.io/dsx-ai-factory/dsx-cds-tools
          tags: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          context: ./cds-containers
          dockerfile: cds-containers/tools/Dockerfile
          platforms: linux/amd64
          push: "true"
          prepare-attestation: "true"
          security-scan-enabled: "false"
          cache-scope: spdx-attestation-canary-tools-amd64
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test the exact published digest before attesting
        id: smoke
        env:
          IMAGE: ghcr.io/dsx-ai-factory/dsx-cds-tools
          DIGEST: ${{ steps.build.outputs.digest }}
          CANDIDATE: ${{ steps.build.outputs.candidate }}
          SBOM_ARTIFACT_ID: ${{ steps.build.outputs.sbom-artifact-id }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SBOM_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE" == "$IMAGE:candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-"* ]]
          docker run --rm --platform linux/amd64 -i "$IMAGE@$DIGEST" sh -s -- tools \
            < cds-containers/tests/security-runtime.sh
          printf 'image=%s\ndigest=%s\nsbom-artifact-id=%s\n' \
            "$IMAGE" "$DIGEST" "$SBOM_ARTIFACT_ID" >> "$GITHUB_OUTPUT"

  attest-tools:
    name: Attest and verify without promoting tags
    needs: build-tools
    if: >-
      github.repository == 'dsx-ai-factory/dsx-github-actions' &&
      github.ref == 'refs/heads/test/spdx-attestation-canary-20261024'
    uses: ./.github/workflows/attest-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image: ${{ needs.build-tools.outputs.image }}
      digest: ${{ needs.build-tools.outputs.digest }}
      platforms: linux/amd64
      sbom_artifact_id: ${{ needs.build-tools.outputs.sbom-artifact-id }}
      registry: ghcr.io
      runner: linux-amd64-cpu4
      tags: ""
    secrets:
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

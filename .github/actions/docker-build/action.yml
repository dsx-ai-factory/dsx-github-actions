name: "Docker Build"
description: "Build (and optionally push) OCI images with Buildx, multi-arch, and GHA cache"
author: "CDS Platform"

inputs:
  image:
    description: "Image repository without tag (e.g. nvcr.io/org/app or ghcr.io/org/app)"
    required: true
  tags:
    description: "Tags to apply. Accepts comma or newline separated list. Each item may be a tag (e.g. latest) or a full ref (e.g. ghcr.io/org/app:latest). If omitted, defaults to sha-<shortsha>."
    required: false
    default: ""
  context:
    description: "Build context"
    required: false
    default: "."
  dockerfile:
    description: "Path to Dockerfile"
    required: false
    default: "Dockerfile"
  platforms:
    description: "Target platforms for multi-arch build"
    required: false
    default: "linux/amd64,linux/arm64"
  push:
    description: "Whether to push image to registry"
    required: false
    default: "false"
  registry:
    description: "Registry host for docker/login-action (e.g. nvcr.io, ghcr.io). Leave empty for Docker Hub."
    required: false
    default: ""
  username:
    description: "Registry username for docker/login-action"
    required: false
    default: ""
  password:
    description: "Registry password/token for docker/login-action"
    required: false
    default: ""
  cache:
    description: "Enable GitHub Actions cache (type=gha)"
    required: false
    default: "true"
  cache-scope:
    description: "Cache scope for GHA cache. Defaults to a sanitized form of image."
    required: false
    default: ""
  build-args:
    description: "Build args (one per line, KEY=VALUE)"
    required: false
    default: ""
  labels:
    description: "OCI labels (one per line, key=value)"
    required: false
    default: ""
  target:
    description: "Build target stage"
    required: false
    default: ""
  provenance:
    description: "Generate provenance (e.g. false, true, mode=max). Empty uses docker/build-push-action default."
    required: false
    default: ""
  sbom:
    description: "Generate SBOM (e.g. false, true). Empty uses docker/build-push-action default."
    required: false
    default: ""
  security-scan-enabled:
    description: "Build once to OCI, scan every requested Linux platform with Syft/Grype, then publish the same digest. Tool errors always prevent publication."
    required: false
    default: "false"
  security-scan-fail-on-critical:
    description: "If true, fail the action when Critical vulnerabilities are found during security scan."
    required: false
    default: "true"

outputs:
  digest:
    description: "Image digest from build-push-action"
    value: ${{ steps.build.outputs.digest }}
  tags:
    description: "Normalized fully qualified image refs used for build/push"
    value: ${{ steps.normalize.outputs.tags }}

runs:
  using: "composite"
  steps:
    - name: Prepare scripts
      shell: bash
      run: |
        chmod +x "$GITHUB_ACTION_PATH"/scripts/*.sh

    - name: Normalize tags and cache settings
      id: normalize
      shell: bash
      env:
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_CACHE_ENABLED: ${{ inputs.cache }}
        INPUT_CACHE_SCOPE: ${{ inputs.cache-scope }}
      run: |
        "$GITHUB_ACTION_PATH"/scripts/normalize-tags.sh

    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      with:
        buildkitd-config: /etc/buildkit/buildkitd.toml

    - name: Prepare security scan paths
      if: inputs.security-scan-enabled == 'true'
      id: scan_vars
      shell: bash
      run: |
        set -euo pipefail
        scan_dir="$(mktemp -d "${RUNNER_TEMP}/docker-build-scan.XXXXXX")"
        echo "layout=${scan_dir}/candidate" >> "$GITHUB_OUTPUT"
        echo "reports=${scan_dir}/reports" >> "$GITHUB_OUTPUT"
        echo "artifact_name=docker-build-scan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${scan_dir##*.}" >> "$GITHUB_OUTPUT"

    - name: Login to registry
      if: inputs.push == 'true' && inputs.username != '' && inputs.password != ''
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Build image
      id: build
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.security-scan-enabled != 'true' && inputs.push == 'true' }}
        # Scanned builds export once; publication copies this OCI layout after
        # every requested platform passes. The no-scan path retains direct push.
        outputs: ${{ inputs.security-scan-enabled == 'true' && format('type=oci,dest={0},tar=false', steps.scan_vars.outputs.layout) || '' }}
        tags: ${{ steps.normalize.outputs.tags }}
        labels: ${{ inputs.labels }}
        build-args: ${{ inputs.build-args }}
        target: ${{ inputs.target }}
        provenance: ${{ inputs.provenance }}
        sbom: ${{ inputs.sbom }}
        cache-from: ${{ steps.normalize.outputs.cache-from }}
        cache-to: ${{ steps.normalize.outputs.cache-to }}

    - name: Scan all platforms
      id: scan
      if: inputs.security-scan-enabled == 'true'
      shell: bash
      env:
        SCAN_LAYOUT: ${{ steps.scan_vars.outputs.layout }}
        SCAN_DIGEST: ${{ steps.build.outputs.digest }}
        SCAN_PLATFORMS: ${{ inputs.platforms }}
        SCAN_REPORTS: ${{ steps.scan_vars.outputs.reports }}
        SCAN_FAIL_ON_CRITICAL: ${{ inputs.security-scan-fail-on-critical }}
        # Tool image pins live here, alongside the action version pins.
        SYFT_IMAGE: anchore/syft:v1.52.0@sha256:500e2d872ac019436926e8322b4fc1f39441d94d21f6f4046c6ff29b30e8cb02
        GRYPE_IMAGE: anchore/grype:v0.117.0@sha256:ddf9e9f204049f3a4a0955ef70873cabab6a31432125ad4f20a490b54950a253
      run: |
        bash "$GITHUB_ACTION_PATH/scripts/scan-oci.sh"

    - name: Publish scanned artifact
      if: inputs.security-scan-enabled == 'true' && inputs.push == 'true' && steps.scan.outcome == 'success'
      shell: bash
      env:
        OCI_LAYOUT: ${{ steps.scan_vars.outputs.layout }}
        EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        REPORTS: ${{ steps.scan_vars.outputs.reports }}
        IMAGE_TAGS: ${{ steps.normalize.outputs.tags }}
        SKOPEO_IMAGE: quay.io/skopeo/stable:v1.22.2-immutable@sha256:4a16d57b37617a04b3d643079a477a2848efe892dffcdf0ce56df4262b65f810
      run: |
        set -euo pipefail
        publish_tmp="$(mktemp -d "${RUNNER_TEMP}/docker-publish.XXXXXX")"
        trap 'rm -rf "$publish_tmp"' EXIT
        mkdir "$publish_tmp/scratch"
        container=(docker run --rm --user "$(id -u):$(id -g)"
          --cap-drop=ALL --security-opt=no-new-privileges
          --volume "$publish_tmp/scratch:/tmp" --env XDG_CACHE_HOME=/tmp/.cache
          --volume "$publish_tmp/auth.json:/auth.json:ro"
          --volume "$OCI_LAYOUT:/candidate:ro" --volume "$REPORTS:/reports")
        skopeo_args=(copy --all --preserve-digests --digestfile /reports/published.digest --authfile /auth.json)
        while IFS= read -r tag; do
          [[ -n "$tag" ]] || continue
          bash "$GITHUB_ACTION_PATH/scripts/prepare-registry-auth.sh" "$tag" "$publish_tmp/auth.json"
          "${container[@]}" "$SKOPEO_IMAGE" "${skopeo_args[@]}" "oci:/candidate" "docker://$tag"
          if [[ "$(< "$REPORTS/published.digest")" != "$EXPECTED_DIGEST" ]]; then
            echo "::error::Published digest differs from scanned digest"
            exit 1
          fi
        done <<< "$IMAGE_TAGS"

    - name: Upload platform scan reports
      if: ${{ always() && inputs.security-scan-enabled == 'true' && steps.scan_vars.outputs.reports != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ steps.scan_vars.outputs.artifact_name }}
        path: ${{ steps.scan_vars.outputs.reports }}
        if-no-files-found: ignore

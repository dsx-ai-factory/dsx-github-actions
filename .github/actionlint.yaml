self-hosted-runner:
  labels:
    - linux-amd64-cpu4

paths:
  .github/workflows/promote-rc.yml:
    ignore:
      # Same pinned shared-workflow identity properties as the RC publisher.
      - '^property "workflow_(sha|repository)" is not defined in object type \{check_run_id: number; container:'
  .github/workflows/promote-rc-tag.yml:
    ignore:
      # Same pinned shared-workflow identity properties as promote-rc.yml.
      - '^property "workflow_(sha|repository)" is not defined in object type \{check_run_id: number; container:'
  .github/workflows/attest-image.yml:
    ignore:
      # Same GitHub.com workflow identity properties used by the RC workflows.
      - '^property "workflow_(sha|repository)" is not defined in object type \{check_run_id: number; container:'
  .github/workflows/build-cds-containers.yml:
    ignore:
      # GitHub supports concurrency.queue; remove when actionlint learns it.
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
  .github/workflows/docker-build.yml:
    ignore:
      # Remove when actionlint supports the called workflow's job.workflow_sha.
      - '^property "workflow_sha" is not defined in object type \{check_run_id: number; container:'
  .github/workflows/fern-docs-ci.yml:
    ignore:
      # Remove when actionlint supports the called workflow's job.workflow_sha.
      - '^property "workflow_sha" is not defined in object type \{check_run_id: number; container:'
  .github/workflows/release-candidate.yml:
    ignore:
      # GitHub.com supports workflow identity; actionlint 1.7.12 does not yet.
      - '^property "workflow_(sha|repository)" is not defined in object type \{check_run_id: number; container:'
  .github/workflows/release-candidate-checks.yml:
    ignore:
      # Keep this exception limited to the two documented job properties.
      - '^property "workflow_(sha|repository)" is not defined in object type \{check_run_id: number; container:'
  .github/workflows/release-candidate-publish.yml:
    ignore:
      # Same workflow identity properties as the source-only RC publisher.
      - '^property "workflow_(sha|repository)" is not defined in object type \{check_run_id: number; container:'
  .github/workflows/fern-docs-preview-build.yml:
    ignore:
      # Same called-workflow SHA property used by fern-docs-ci.yml.
      - '^property "workflow_sha" is not defined in object type \{check_run_id: number; container:'
  .github/workflows/fern-docs-preview-comment.yml:
    ignore:
      # Same called-workflow SHA property used by fern-docs-ci.yml.
      - '^property "workflow_sha" is not defined in object type \{check_run_id: number; container:'
  .github/workflows/publish-fern-docs.yml:
    ignore:
      # Same called-workflow SHA property used by fern-docs-ci.yml.
      - '^property "workflow_sha" is not defined in object type \{check_run_id: number; container:'
      # Same concurrency queue support used by build-cds-containers.yml.
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
